services:
  - type: web
    name: pedidoscompra
    runtime: node
    plan: free
    buildCommand: npm --prefix backend ci && npm --prefix backend run build
    startCommand: npm --prefix backend start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://pedidoscompra.esteling.com
      - key: REACT_APP_API_URL
        value: ""
      - key: MONGO_URI
        sync: false
      - key: ENTRA_TENANT_ID
        sync: false
      - key: ENTRA_CLIENT_ID
        sync: false
      - key: TENANT_ID
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: BC_SCOPE
        sync: false
      - key: BC_ENVIRONMENT
        value: Production
      - key: BC_COMPANY_ID
        sync: false
      - key: BC_COMPANY_NAME
        sync: false
      - key: BC_PROJECTS_SERVICE
        value: proyectos
      - key: BC_LOG_REQUESTS
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: GENERATE_SOURCEMAP
        value: "false"
